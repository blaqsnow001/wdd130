<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description"
      content="Whitewater rafting is a type of recreation that involves navigating a non-motorized watercraft down free flowing rivers.">
    <meta name="author" content="Okocha Snow Obianujuaku">
    <link rel="stylesheet" href="styles/rafting.css">
    <title>Snow Resorts |Contact Us</title>
</head>

<body>
    <header>
        <img src="images/z-wwr-blue.jpg" alt="WWR logo">
        <nav>
            <a href="index.html">Home</a>
            <a href="about.html">About Us</a>
            <a href="trips.html">Trips</a>
            <a href="contact.html">Contact Us</a>
        </nav>
    </header>

    <main>
        <h2>White Water Rafting Company</h2>

        <section class="company-info">
            <p>123 Main River Street</p>
            <p>Kolob,Portharcourt</p>
            <p>+1 999 999 9999</p>
            <p><a href="mailto:info@whitewater.com">info@whitewater.com</a></p>

            <iframe
              src="https://www.google.com/maps/embed?pb=!1m23!1m12!1m3!1d145074.68634780342!2d6.977860556604606!3d4.91623577287219!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!4m8!3e6!4m0!4m5!1s0x1069d3e3b8df2c07%3A0x82742dec9b1b4696!2sV2WQ%2B7XG%20Amusement%20Park%20in%20Port%20Harcourt%20RutaLand%2C%20ENEKA%20ROAD%2C%20Igwuruta%20Road%2C%20Eneka!3m2!1d4.8956982!2d7.0399582!5e0!3m2!1sen!2sng!4v1770500600564!5m2!1sen!2sng"
              width="600" height="450" allowfullscreen="" loading="lazy"
              referrerpolicy="no-referrer-when-downgrade"></iframe>

        </section>

        <section class="employee-profiles">
            <h2>We Are Here to Serve You</h2>
            <div class="profile-container">
                <figure>
                    <img src="images/employee1.jpg" alt="Employee 1">
                    <figcaption>Employee Profile</figcaption>
                </figure>
                <figure>
                    <img src="images/employee2.jpg" alt="Employee 2">
                    <figcaption>Employee Profile</figcaption>
                </figure>
                <figure>
                    <img src="images/employee3.jpg" alt="Employee 3">
                    <figcaption>Employee Profile</figcaption>
                </figure>
            </div>
        </section>
        <section class="contact-form">
            <form>
                <label for="name">Name</label>
                <input type="text" id="name" name="name" placeholder="Placeholder">

                <label for="email">Email</label>
                <input type="email" id="email" name="email" placeholder="Placeholder">

                <fieldset>
                    <legend>Message Purpose</legend>
                    <label>
                        <input type="radio" id="general" name="purpose" value="general" checked>
                        General Inquiry
                    </label>
                    <label>
                        <input type="radio" id="reservation" name="purpose" value="reservation">
                        Reservation Question
                    </label>
                    <label>
                        <input type="radio" id="suggestion" name="purpose" value="suggestion">
                        Website Suggestion
                    </label>
                </fieldset>

                <label for="message">Message</label>
                <textarea id="message" name="message" rows="5" placeholder="Type here"></textarea>

                <label>
                    <input type="checkbox" id="newsletter" name="newsletter">
                    Please subscribe me to the monthly newsletter
                </label>

                <button type="submit">Get in Touch!</button>
            </form>
        </section>
    </main>
    <footer>
        <p>©2026 | Snow Resorts |Okocha Snow Obianujuaku</p>
        <nav class="socialmedia">
            <a href="https://www.youtube.com"><img src="images/youtube-square.svg"
                  alt="youtube-logo"></a>
            <a href="https://www.instagram.com"><img src="images/instagram-square.svg"
                  alt="instagram-logo"></a>
            <a href="https://www.facebook.com"><img src="images/facebook.svg"
                  alt="facebook-logo"></a>
        </nav>
    </footer>
</body>

</html>
