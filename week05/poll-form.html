<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="styles/poll-form.css">
    <title>Poll</title>
</head>

<body>
    <form>
        <div class="form-item column2">
            <label for="fullname">Full Name:</label>
            <input type="text" id="fullname" name="fullname" required>
        </div>
        <div class="form-item column2">
            <label for="useremail">Email</label>
            <input type="email" id="useremail" name="useremail" required>
        </div>
    </form>
    <div class="form-item column1">
        <label for="quantity">What is your Favorite Browser</label>
        <select name="quantity" id="quantity">
            <option value="1">Chrome</option>
            <option value="2">Brave</option>
            <option value="3">Safari</option>
            <option value="4">Other</option>
        </select>
    </div>
    <div class="form-item column1">
        <label for="Pet">Do you have a household Pet</label>
        <input type="checkbox" id="pet" name="pet">
    </div>

    <label for="feedback">List place you have lived </label>
    <textarea name="feedback" id="feedback" rows="4"
      placeholder="Aba Abia state, Gwagwalada Abuja, Ajah Lagos, KomKom Portharcourt"></textarea>
    <button type="submit">Submit Poll</button>
</body>

</html>
